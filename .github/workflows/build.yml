name: Build firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # upstream's build container (tag latest = main): all build dependencies, user buildbot.  Its
    # /prebuilt_tools match upstream HEAD, not our pinned commit, so host tools are built here
    # (~15 min); the target toolchain comes prebuilt from downloads.openwrt.org instead.
    container: ghcr.io/openwrt/tools:latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Fix permissions
        run: chown -R buildbot:buildbot .

      - name: Prepare (prebuilt toolchain, patches, feed, config)
        shell: su buildbot -c "sh -e {0}"
        run: make prepare TOOLCHAIN_DIR="$(scripts/get-toolchain.sh)"

      - name: Build
        shell: su buildbot -c "sh -e {0}"
        run: make image || make image NPROC=1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-dir868l-b1
          path: out/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
