name: Build firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # weekly: if upstream OpenWrt main moved, bump the submodule, build, and publish a release
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      bump:
        description: Bump openwrt to upstream main and publish a release if it builds
        type: boolean
        default: false

env:
  UPSTREAM: https://github.com/openwrt/openwrt.git

jobs:
  # Decide what this run does.  Cheap: no container, no submodule.
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}   # run the build at all
      bump: ${{ steps.decide.outputs.bump }}     # move openwrt/ to this upstream commit first
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        run: |
          pinned=$(git rev-parse HEAD:openwrt)
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch)
              if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.bump }}" != true ]; then
                echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
              head=$(git ls-remote "$UPSTREAM" refs/heads/main | cut -f1)
              echo "pinned $pinned, upstream main $head"
              if [ "$head" = "$pinned" ]; then
                echo "up to date, nothing to do"
              else
                echo "build=true" >> "$GITHUB_OUTPUT"
                echo "bump=$head" >> "$GITHUB_OUTPUT"
                echo "release=true" >> "$GITHUB_OUTPUT"
              fi ;;
            *)
              echo "build=true" >> "$GITHUB_OUTPUT"
              case "${{ github.ref }}" in refs/tags/v*) echo "release=true" >> "$GITHUB_OUTPUT";; esac ;;
          esac

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # upstream's build container (tag latest = main): all build dependencies; its entrypoint
      # switches to user buildbot (uid 1000; the runner is 1001, hence the chowns).  Run through
      # `docker run` rather than as a container job so the host's disk can be cleaned first: a
      # build needs ~15 GB and a hosted runner has about that free.  Its /prebuilt_tools match
      # upstream HEAD, not our pinned commit, so host tools are built here (~15 min); the target
      # toolchain comes prebuilt from downloads.openwrt.org instead.
      TOOLS: ghcr.io/openwrt/tools:latest
    steps:
      - name: Free disk space
        run: |
          df -h / | tail -n 1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/lib/jvm \
            /usr/local/julia* /usr/share/miniconda /opt/az /usr/local/share/boost /opt/microsoft
          sudo docker image prune -af >/dev/null
          df -h / | tail -n 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Bump openwrt to upstream main
        if: needs.check.outputs.bump != ''
        run: |
          git -C openwrt fetch --depth 1 origin ${{ needs.check.outputs.bump }}
          git -C openwrt checkout -q FETCH_HEAD

      # actions/checkout clones the submodule with depth 1, which leaves scripts/getver.sh (the
      # rNNNNN revision number in the version string) nothing to count.  Count in a separate
      # commit-graph-only clone (no trees, no blobs: ~40 MB) and hand the result to getver.sh
      # through the `version` file it reads first.
      - name: OpenWrt version
        id: ver
        run: |
          sha=$(git -C openwrt rev-parse HEAD)
          git clone -q --bare --filter=tree:0 --single-branch --branch main "$UPSTREAM" /tmp/owrt-graph
          n=$(git -C /tmp/owrt-graph rev-list --count ee53a240ac902dc83209008a2671e7fdcf55957a..$sha)
          ver="r$n-$(git -C /tmp/owrt-graph rev-parse --short=10 $sha)"
          echo "$ver" > openwrt/version
          echo "version=$ver" | tee -a "$GITHUB_OUTPUT"
          echo "sha=$sha" | tee -a "$GITHUB_OUTPUT"

      - name: Build container
        run: |
          docker pull -q "$TOOLS"
          echo "RUN=docker run --rm -v $PWD:$PWD -w $PWD $TOOLS" >> "$GITHUB_ENV"

      - name: Prepare (prebuilt toolchain, patches, feed, config)
        run: |
          sudo chown -R 1000:1000 .
          $RUN make prepare TOOLCHAIN_DIR="$(scripts/get-toolchain.sh)"

      - name: Build
        run: $RUN make image || $RUN make image NPROC=1 V=s 2>&1 | tail -n 3000

      - name: Disk usage, take the results back
        if: always()
        run: |
          df -h / | tail -n 1
          du -sh openwrt/build_dir openwrt/staging_dir openwrt/dl openwrt/tmp toolchain 2>/dev/null || true
          sudo chown "$(id -u):$(id -g)" . && sudo chown -R "$(id -u):$(id -g)" .git out

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-dir868l-b1-${{ steps.ver.outputs.version }}
          path: out/

      # A bump that built is committed to main (the token's push starts no new workflow run).
      - name: Commit the bump
        if: needs.check.outputs.bump != ''
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add openwrt
          git commit -m "openwrt: bump to ${{ steps.ver.outputs.version }}"
          git push origin HEAD:main

      - name: Release notes
        if: needs.check.outputs.release == 'true'
        id: rel
        run: |
          ver='${{ steps.ver.outputs.version }}'
          if [ -n '${{ needs.check.outputs.bump }}' ]; then
            tag="openwrt-$ver"; title="OpenWrt snapshot $ver"
            kind="Built automatically after upstream OpenWrt main moved to $ver; not tested on hardware."
          else
            tag='${{ github.ref_name }}'; title="$tag (OpenWrt $ver)"
            kind="Built from the pinned OpenWrt snapshot $ver."
          fi
          { echo "$kind  Upstream commit: https://github.com/openwrt/openwrt/commit/${{ steps.ver.outputs.sha }}"
            echo; cat .github/release-notes.md
            echo; echo '```'; grep -E '\.(bin|manifest)$' out/sha256sums; echo '```'; } > notes.md
          { echo "tag=$tag"; echo "title=$title"; echo "sha=$(git rev-parse HEAD)"; } | tee -a "$GITHUB_OUTPUT"

      - name: Release
        if: needs.check.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ steps.rel.outputs.sha }}
          name: ${{ steps.rel.outputs.title }}
          body_path: notes.md
          fail_on_unmatched_files: true
          files: |
            out/*.bin
            out/*.manifest
            out/sha256sums
